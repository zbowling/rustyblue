[package]
name = "rustyblue"
version = "0.1.0"
edition = "2021"
authors = ["Zac Bowling <zac@zacbowling.com>"]
description = "A Rust library for Bluetooth HCI communication"
license = "MIT"
repository = "https://github.com/zacbowling/rustyblue"
keywords = ["bluetooth", "hci", "ble", "bluetooth-low-energy"]
categories = ["hardware-support", "network-programming"]


[dependencies]
libc = "0.2"
uuid = { version = "1.0", features = ["v4", "serde"] }
log = "0.4"
zerocopy = "0.7"
byteorder = "1.5"
rand = "0.8"
hex = "0.4"
bitflags = "1.3"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"